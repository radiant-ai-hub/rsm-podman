name: Test Build - Podman (Minimal)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Test version (leave empty for auto: test-SHA)'
        required: false
        default: ''
      push_to_registry:
        description: 'Push to registry (for testing manifest creation)'
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - 'test-builds/podman/**'
      - '.github/workflows/test-podman-build.yml'

env:
  REGISTRY: ghcr.io
  TEST_IMAGE: radiant-ai-hub/rsm-podman-test

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      push_to_registry: ${{ steps.get-version.outputs.push_to_registry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: get-version
        run: |
          PUSH_TO_REGISTRY="${{ inputs.push_to_registry }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="test-${GITHUB_SHA:0:7}"
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PUSH_TO_REGISTRY="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "push_to_registry=$PUSH_TO_REGISTRY" >> $GITHUB_OUTPUT
          echo "Test version: $VERSION"
          echo "Push to registry: $PUSH_TO_REGISTRY"

  build-amd64:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR with Podman
        if: needs.determine-version.outputs.push_to_registry == 'true'
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ${{ env.REGISTRY }} -u vnijs --password-stdin

      - name: Build amd64 image with Podman
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          podman build \
            --platform linux/amd64 \
            --layers=false \
            --format docker \
            --tag ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-amd64 \
            --build-arg IMAGE_VERSION=${VERSION} \
            -f test-builds/podman/Containerfile.minimal \
            .

      - name: Push amd64 image
        if: needs.determine-version.outputs.push_to_registry == 'true'
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          for i in 1 2 3; do
            podman push --remove-signatures ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-amd64 && break
            echo "Push attempt $i failed, retrying in 30s..."
            sleep 30
          done

  build-arm64:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install Podman
        run: |
          sudo apt-get install -y podman

      - name: Log in to GHCR with Podman
        if: needs.determine-version.outputs.push_to_registry == 'true'
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ${{ env.REGISTRY }} -u vnijs --password-stdin

      - name: Build arm64 image with Podman
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          podman build \
            --platform linux/arm64 \
            --layers=false \
            --format docker \
            --tag ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-arm64 \
            --build-arg IMAGE_VERSION=${VERSION} \
            -f test-builds/podman/Containerfile.minimal \
            .

      - name: Push arm64 image
        if: needs.determine-version.outputs.push_to_registry == 'true'
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          for i in 1 2 3; do
            podman push --remove-signatures ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-arm64 && break
            echo "Push attempt $i failed, retrying in 30s..."
            sleep 30
          done

  create-manifest:
    needs: [determine-version, build-amd64, build-arm64]
    if: needs.determine-version.outputs.push_to_registry == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR with Podman
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ${{ env.REGISTRY }} -u vnijs --password-stdin

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          echo "Creating manifest for version: $VERSION"

          # Create manifest (same approach as production)
          podman manifest create ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}
          podman manifest add ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION} \
            docker://${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-amd64
          podman manifest add ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION} \
            docker://${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-arm64
          podman manifest push --all ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION} \
            docker://${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}

          echo "✓ Created test manifest: ${VERSION}"

          # Also create latest tag to test the full manifest creation workflow
          echo "Creating latest tag..."
          podman manifest create ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest
          podman manifest add ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest \
            docker://${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-amd64
          podman manifest add ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest \
            docker://${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}-arm64
          podman manifest push --all ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest \
            docker://${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest

          echo "✓ Created latest tag"

      - name: Verify manifest
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          echo "=== Test Manifest Inspection (Version Tag) ==="
          podman manifest inspect ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}

          echo ""
          echo "=== Test Manifest Inspection (Latest Tag) ==="
          podman manifest inspect ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:latest

  integration-tests:
    needs: [determine-version, create-manifest]
    if: needs.determine-version.outputs.push_to_registry == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Set up QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install Podman
        run: |
          sudo apt-get install -y podman

      - name: Log in to GHCR with Podman
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ${{ env.REGISTRY }} -u vnijs --password-stdin

      - name: Pull and test image
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          echo "Testing ${{ matrix.platform }}"
          podman pull --platform ${{ matrix.platform }} ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}

          # Run the container (test script is the default CMD)
          podman run --rm --platform ${{ matrix.platform }} ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION}

      - name: Test architecture verification
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          podman run --rm --platform ${{ matrix.platform }} ${{ env.REGISTRY }}/${{ env.TEST_IMAGE }}:${VERSION} \
            python -c "import platform; print(f'Architecture: {platform.machine()}')"

name: Check pyrsm Version

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  pull_request:
    paths:
      - 'files/install-uv.sh'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check pyrsm version
        id: check
        run: |
          # Extract pinned version
          PINNED=$(grep -oP 'pyrsm==\K[0-9]+\.[0-9]+\.[0-9]+' files/install-uv.sh || echo "")
          if [[ -z "$PINNED" ]]; then
            echo "ERROR: Could not extract pyrsm version from files/install-uv.sh"
            exit 1
          fi
          echo "pinned_version=$PINNED" >> $GITHUB_OUTPUT

          # Fetch latest from PyPI
          LATEST=$(curl -sS https://pypi.org/pypi/pyrsm/json | grep -oP '"version":\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [[ -z "$LATEST" ]]; then
            echo "ERROR: Could not fetch latest version from PyPI"
            exit 1
          fi
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT

          echo "Pinned: $PINNED"
          echo "Latest: $LATEST"

          if [[ "$PINNED" != "$LATEST" ]]; then
            echo "is_outdated=true" >> $GITHUB_OUTPUT
            echo "MISMATCH: pyrsm $PINNED is outdated (latest: $LATEST)"
          else
            echo "is_outdated=false" >> $GITHUB_OUTPUT
            echo "OK: pyrsm version is current"
          fi

      - name: Fail on PR with outdated version
        if: github.event_name == 'pull_request' && steps.check.outputs.is_outdated == 'true'
        run: |
          echo "::error::pyrsm version is outdated: ${{ steps.check.outputs.pinned_version }} (latest: ${{ steps.check.outputs.latest_version }})"
          echo ""
          echo "Please update files/install-uv.sh to use pyrsm==${{ steps.check.outputs.latest_version }}"
          exit 1

      - name: Create issue if outdated (scheduled run)
        if: github.event_name == 'schedule' && steps.check.outputs.is_outdated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `pyrsm version outdated: ${process.env.PINNED} → ${process.env.LATEST}`;

            // Check if issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pyrsm-update'
            });

            const issueExists = existingIssues.data.some(issue =>
              issue.title.includes('pyrsm version outdated')
            );

            if (issueExists) {
              console.log('Issue already exists, skipping creation');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## pyrsm Version Update Required

            The pinned pyrsm version in \`files/install-uv.sh\` is outdated.

            | Current | Latest |
            |---------|--------|
            | ${process.env.PINNED} | ${process.env.LATEST} |

            ### To fix:
            1. Edit \`files/install-uv.sh\`
            2. Change \`pyrsm==${process.env.PINNED}\` to \`pyrsm==${process.env.LATEST}\`
            3. Commit and push

            ### Links
            - [PyPI pyrsm](https://pypi.org/project/pyrsm/)
            - [pyrsm Changelog](https://github.com/vnijs/pyrsm/releases)

            ---
            *This issue was automatically created by the check-pyrsm-version workflow.*`,
              labels: ['pyrsm-update', 'dependencies']
            });

            console.log('Created new issue for pyrsm update');
        env:
          PINNED: ${{ steps.check.outputs.pinned_version }}
          LATEST: ${{ steps.check.outputs.latest_version }}

      - name: Summary
        run: |
          echo "## pyrsm Version Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pinned | ${{ steps.check.outputs.pinned_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest | ${{ steps.check.outputs.latest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check.outputs.is_outdated }}" == "true" ]]; then
            echo "**Status:** Outdated" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Current" >> $GITHUB_STEP_SUMMARY
          fi

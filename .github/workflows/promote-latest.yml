name: Promote latest tags

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to promote to latest (e.g., 2.5.0)'
        required: true
        type: string
      promote_dockerhub:
        description: 'Promote Docker Hub latest tag'
        required: false
        default: true
        type: boolean
      promote_ghcr:
        description: 'Promote GHCR latest tag'
        required: false
        default: true
        type: boolean

env:
  DOCKERHUB_IMAGE: vnijs/rsm-msba-k8s
  GHCR_IMAGE: ghcr.io/radiant-ai-hub/rsm-msba-k8s

jobs:
  promote-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.promote_dockerhub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        if: ${{ inputs.promote_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Promote Docker Hub latest
        if: ${{ inputs.promote_dockerhub }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Promoting Docker Hub latest -> ${VERSION}"
          docker buildx imagetools create \
            --tag ${{ env.DOCKERHUB_IMAGE }}:latest \
            ${{ env.DOCKERHUB_IMAGE }}:${VERSION}-amd64 \
            ${{ env.DOCKERHUB_IMAGE }}:${VERSION}-arm64

      - name: Promote GHCR latest
        if: ${{ inputs.promote_ghcr }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Promoting GHCR latest -> ${VERSION}"
          docker buildx imagetools create \
            --tag ${{ env.GHCR_IMAGE }}:latest \
            ${{ env.GHCR_IMAGE }}:${VERSION}-amd64 \
            ${{ env.GHCR_IMAGE }}:${VERSION}-arm64
